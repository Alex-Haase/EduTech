<!DOCTYPE html>
<html lang="es">
    <head> 
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cursos Disponibles</title>
        <link rel="stylesheet" href="styles.css" />
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f5f5f5;
            }

            header {
                background-color: #007BFF;
                padding: 20px;
                color: white;
                text-align: center;
            }

            .curso-lista {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 1rem;
                padding: 2rem;
            }

            .curso {
                background-color: white;
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 1rem;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }

            .curso h2 {
                margin-top: 0;
            }

            .curso button {
                background-color: #2980b9;
                color: white;
                border: none;
                padding: 0.5rem 1rem;
                border-radius: 4px;
                cursor: pointer;
            }

            .curso button:hover {
                background-color: #1f6391;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Cursos Disponibles</h1>
            
        </header>

        <main class="curso-lista">
    <div class="curso">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg" alt="Python Logo" style="width: 100%; height: 150px; object-fit: contain; margin-bottom: 10px;">
        <h2>Introducción a Python</h2>
        <p>Aprende los fundamentos de programación con Python.</p>
        <p><strong>Precio: </strong>$49.99</p>
        <a href="cursoPython.html" class="boton-vermas">Ver más</a>
    </div>

    <div class="curso">
        <img src="https://upload.wikimedia.org/wikipedia/en/3/30/Java_programming_language_logo.svg" alt="Java Logo" style="width: 100%; height: 150px; object-fit: contain; margin-bottom: 10px;">
        <h2>Java Básico</h2>
        <p>Curso de Java para principiantes.</p>
        <p><strong>Precio: </strong>$59.99</p>
        <a href="cursoJava.html" class="boton-vermas">Ver más</a>
    </div>

    <div class="curso">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" alt="React Logo" style="width: 100%; height: 150px; object-fit: contain; margin-bottom: 10px;">
        <h2>React JS</h2>
        <p>Desarrolla aplicaciones web modernas con React.</p>
        <p><strong>Precio: </strong>$64.99</p>
        <a href="cursoReact.html" class="boton-vermas">Ver más</a>
    </div>
</main>

    </body>
</html>
