<!DOCTYPE html>
<html lang="es">
    <head> 
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cursos Disponibles</title>
        <link rel="stylesheet" href="styles.css" />
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f5f5f5;
            }

            header {
                background-color: #007BFF;
                padding: 20px;
                color: white;
                text-align: center;
            }

            .curso-lista {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 1rem;
                padding: 2rem;
            }

            .curso {
                background-color: white;
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 1rem;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }

            .curso h2 {
                margin-top: 0;
            }

            .curso button {
                background-color: #2980b9;
                color: white;
                border: none;
                padding: 0.5rem 1rem;
                border-radius: 4px;
                cursor: pointer;
            }

            .curso button:hover {
                background-color: #1f6391;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Cursos Disponibles</h1>
        </header>

        <main class="curso_lista">
            <div class="curso">
                <h2>Introduccion a Python</h2>
                <p>Aprende los fundamentos de programación con Python.</p>
                <p><strong>Precio: </strong>$49.99</p>
                <button>Ver más</button>
            </div>
        </main>
    </body>
</html>
